name: Windows verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Verify pinned official-source signatures and exact catalogue
        run: npm run test:catalogue
      - name: DNS build input validation (no device or build network requests)
        run: npm run test:dns-build
      - name: Extraction boundary regressions (synthetic input only)
        run: npm run test:extraction-worker
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production executable guard regression (Windows PowerShell)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-production-executable-guard.ps1
      - name: Local inventory privacy and output guards (synthetic only)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/inventory-physical-device.ps1 -SelfTest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --features native-test-profile --locked -- -D warnings
      - run: cargo test --workspace --features native-test-profile --locked
      - run: npm run tauri build
      - run: npm run build:native-tests
      - uses: actions/upload-artifact@v4
        with:
          name: obtainer-windows-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/obtainer.exe
  dns-helper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated-worker test prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap zstd squashfs-tools
      - name: Synthetic build-worker and kernel isolation regressions (no firmware download)
        run: python -B scripts/test-dns-build.py

      - name: Extraction parser and supervisor regressions (synthetic input only)
        run: python -B scripts/test-firmware-extraction.py
  extraction-worker-qualified:
    # Keep modern tools in the disposable container; use the established
    # namespace-capable host rather than altering a host AppArmor policy.
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:26.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install maintained tools in disposable qualification container
        run: apt-get update && apt-get install --no-install-recommends -y python3 bubblewrap squashfs-tools util-linux passwd
      - name: Run every extraction regression as an ordinary user
        run: |
          useradd --create-home extraction-ci
          runuser -u extraction-ci -- python3 -B scripts/test-firmware-extraction.py
